[project]
name = "wordle-alarm"
version = "0.1.0"
description = ""
authors = [
    {name = "momonala", email = "mnalavadi@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "playwright",
    "requests",
    "schedule",
    "pandas>=3.0.6",
    "beautifulsoup4>=4.15.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "black",
    "pandas>=3.0.6",
    "ruff>=0.17.0",
    "typer>=0.27.3",
    "isort>=9.0.2",
    "python-dotenv>=1.2.4",
]

[tool.config]
# This project is primarily configured via secrets in .env
# No non-secret configuration needed currently

[project.scripts]
config = "src.config:main"
main = "src.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.black]
line-length = 110
target-version = ['py312']
include = '\.pyi?$'

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-s -v --cov=src --cov-report=term-missing"

[tool.coverage.run]
omit = ["tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.uv]
exclude-newer = "1 week"
exclude-newer-package = { certifi = false }
